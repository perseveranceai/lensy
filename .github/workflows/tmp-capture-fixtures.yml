name: Capture scoring fixtures (temporary)
# Scratch branch only, never merged: the cloud session that builds the
# two-score change can't reach docs sites, so the capture runs here.
on:
  push:
    branches: [tmp/capture-fixtures]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '23.11.0'
      - name: Capture
        run: node backend/scripts/capture-fixtures.mjs || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fixtures
          path: backend/lambda/agent-handler/tools/__tests__/fixtures/
