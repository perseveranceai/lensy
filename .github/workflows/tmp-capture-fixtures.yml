name: Capture scoring fixtures (temporary)
# Scratch branch only, never merged: the cloud session that builds the
# two-score change can't reach docs sites, so the capture runs here.
on:
  push:
    branches: [tmp/capture-fixtures]
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '23.11.0'
      - name: Capture
        run: mkdir -p backend/lambda/agent-handler/tools/__tests__ && node backend/scripts/capture-fixtures.mjs 2>&1 | tee backend/lambda/agent-handler/tools/__tests__/capture-log.txt || true
      - name: Commit the fixtures back to this scratch branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/lambda/agent-handler/tools/__tests__/
          git commit -m "Captured fixtures $(date -u +%FT%TZ)" || true
          git push origin HEAD:tmp/capture-fixtures
