name: Deploy

# Trunk-based: every merge to main ships gamma automatically, then the SAME
# commit waits on an approval before it ships prod. Credentials come from OIDC
# with one role per environment — the gamma role's trust policy admits only
# refs/heads/main, the prod role's only environment:production, so a gamma run
# cannot reach prod even if this file is wrong.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  actions: read

# NOTE: concurrency is set per-job, not workflow-wide. A workflow-level group
# meant a prod deployment sitting on a human approval held the lock and froze
# the gamma lane behind it — the longer a considered prod decision took, the
# longer automatic gamma deploys stopped. Separate groups let gamma keep
# flowing while prod approvals queue among themselves.

env:
  AWS_REGION: us-east-1
  NODE_VERSION: '23.11.0'

jobs:
  gamma:
    name: Deploy gamma
    runs-on: ubuntu-latest
    concurrency:
      # Never cancel in flight: an interrupted cdk deploy leaves CloudFormation
      # mid-update, which is materially worse than waiting.
      group: deploy-gamma-main
      cancel-in-progress: false
    outputs:
      target_env: ${{ steps.classify.outputs.target_env }}
      verdict: ${{ steps.classify.outputs.verdict }}
      reasons: ${{ steps.classify.outputs.reasons }}
      deploy_id: ${{ steps.classify.outputs.deploy_id }}
      gamma_finished_at: ${{ steps.finished.outputs.ts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the classifier diffs against the previous commit

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: arn:aws:iam::951411676525:role/lensy-gha-gamma
          aws-region: ${{ env.AWS_REGION }}

      - name: Install backend
        working-directory: backend
        # Each lambda/ directory carries its own package.json; `npm ci` here
        # installs none of them. They resolve locally only because of leftover
        # node_modules, so a clean checkout cannot build without this.
        run: npm ci && npm run install:lambdas

      - name: Build backend + lambdas
        working-directory: backend
        run: npm run build && npm run build:lambdas

      - name: CDK diff
        working-directory: backend
        env:
          LENSY_ENV: gamma
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
        # Captured for the classifier: this is the only reliable read on blast
        # radius. Never fail the build on a diff being present.
        run: npx cdk diff 2>&1 | tee "${GITHUB_WORKSPACE}/cdk-diff.txt" || true

      - name: CDK deploy gamma
        working-directory: backend
        env:
          LENSY_ENV: gamma
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
        run: npx cdk deploy --require-approval never

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Build frontend (gamma + prod bundles)
        working-directory: frontend
        env:
          CI: false  # CRA turns lint warnings into errors under CI; see ci.yml
        # Both bundles are built here, from the same checkout and install. The
        # prod job deploys the build-prod/ bundle from THIS run instead of
        # rebuilding, so what reaches prod is built alongside the gamma bundle
        # that the e2e suite below tests.
        run: |
          npm run build:gamma
          npm run check:css
          BUILD_PATH=build-prod npm run build:prod
          npm run check:css -- build-prod

      - name: Keep the prod bundle for the prod job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-prod-${{ github.sha }}
          path: frontend/build-prod/
          retention-days: 7
          if-no-files-found: error

      - name: Publish gamma frontend
        working-directory: frontend
        run: |
          aws s3 sync build/ s3://lensy-console-951411676525-us-east-1-gamma --delete
          aws cloudfront create-invalidation \
            --distribution-id E1J3M0RUB5VA7F --paths "/*"

      - name: Wait until gamma serves this build
        working-directory: frontend
        # Testing right after an invalidation can hit the previous build from
        # cache. Poll the live index.html until it references this run's
        # bundle (the gamma role can create invalidations but not read their
        # status, so `aws cloudfront wait` isn't available).
        run: |
          built=$(grep -o 'main\.[a-z0-9]*\.js' build/index.html | head -1)
          for i in $(seq 1 40); do
            served=$(curl -s -H 'Cache-Control: no-cache' "https://gamma.perseveranceai.com/?deploy=${GITHUB_RUN_ID}" | grep -o 'main\.[a-z0-9]*\.js' | head -1 || true)
            echo "attempt $i: built=$built served=$served"
            [ -n "$built" ] && [ "$built" = "$served" ] && exit 0
            sleep 15
          done
          echo "::error::gamma still not serving $built after 10 minutes"
          exit 1

      - name: Smoke test gamma
        id: smoke
        run: |
          node scripts/smoke-test.js \
            --base-url https://bnkzdze378.execute-api.us-east-1.amazonaws.com \
            --out "${GITHUB_WORKSPACE}/smoke.json"

      - name: E2E tests on gamma (prod gate)
        working-directory: frontend
        env:
          E2E_BASE_URL: https://gamma.perseveranceai.com
        # The docs/test-cases.md suite, run against the gamma we just deployed.
        # If any test fails, this job fails and the prod job never starts.
        # Uses the runner's installed Chrome; installs it only if missing.
        run: |
          [ -x /opt/google/chrome/chrome ] || npx playwright install --with-deps chrome
          npm run test:e2e

      - name: Keep the e2e report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report-${{ github.sha }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14

      - name: Classify deploy risk
        id: classify
        if: always() # a red smoke test is itself a feature worth recording
        run: |
          node scripts/assess-deploy-risk.js \
            --base "${{ github.event.before }}" \
            --head "${{ github.sha }}" \
            --author "${{ github.actor }}" \
            --cdk-diff "${GITHUB_WORKSPACE}/cdk-diff.txt" \
            --smoke "${GITHUB_WORKSPACE}/smoke.json" \
            --env prod \
            > "${GITHUB_WORKSPACE}/decision.json"
          cat "${GITHUB_WORKSPACE}/decision.json"

      - name: Record features
        if: always()
        run: node scripts/record-deploy.js --phase features --file "${GITHUB_WORKSPACE}/decision.json"

      - name: Summarise
        if: always()
        run: |
          {
            echo "### Gamma deployed — prod gate: \`${{ steps.classify.outputs.target_env }}\`"
            echo ""
            echo "**Classifier verdict:** \`${{ steps.classify.outputs.verdict }}\`  "
            echo "**Reasons:** ${{ steps.classify.outputs.reasons }}  "
            echo "**Shadow mode:** ${{ steps.classify.outputs.shadow_mode }}"
            echo ""
            echo "<details><summary>cdk diff</summary>"
            echo ""
            echo '```'
            head -c 40000 "${GITHUB_WORKSPACE}/cdk-diff.txt" || true
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Mark finish time
        id: finished
        if: always()
        run: echo "ts=$(date -u +%s)" >> "$GITHUB_OUTPUT"

  prod:
    name: Deploy prod
    needs: gamma
    # Prod only ships what was deployed to gamma and passed its smoke scan and
    # e2e suite in this same run, and only from main.
    if: ${{ needs.gamma.result == 'success' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-prod-main
      cancel-in-progress: false
    # Resolves to 'production' (required reviewer) or, once the decision log has
    # earned it in phase 5, 'production-auto' (no reviewer). Same deploy either
    # way — only the protection rule differs.
    environment: ${{ needs.gamma.outputs.target_env }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: arn:aws:iam::951411676525:role/lensy-gha-prod
          aws-region: ${{ env.AWS_REGION }}

      - name: Install backend
        working-directory: backend
        # Each lambda/ directory carries its own package.json; `npm ci` here
        # installs none of them. They resolve locally only because of leftover
        # node_modules, so a clean checkout cannot build without this.
        run: npm ci && npm run install:lambdas

      - name: Build backend + lambdas
        working-directory: backend
        run: npm run build && npm run build:lambdas

      - name: CDK deploy prod
        working-directory: backend
        env:
          LENSY_ENV: prod
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
        run: npx cdk deploy --require-approval never

      - name: Get the prod bundle built in the gamma job
        # No rebuild here: deploy exactly the bundle built (and CSS-checked)
        # alongside the gamma bundle that passed e2e in this run.
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-prod-${{ github.sha }}
          path: frontend/build-prod/

      - name: Publish frontend
        working-directory: frontend
        # NOTE: prod frontend is NOT the stack's ConsoleBucketName output
        # (lensy-console-951411676525-us-east-1 redirects). The live site is
        # served from www.perseveranceai.com behind E274OKID4GUQ1J. Wiring this
        # to stack outputs would "succeed" and change nothing visible.
        run: |
          aws s3 sync build-prod/ s3://www.perseveranceai.com --delete
          aws cloudfront create-invalidation \
            --distribution-id E274OKID4GUQ1J --paths "/*"

      - name: Smoke test prod
        run: |
          node scripts/smoke-test.js \
            --base-url https://5gg6ce9y9e.execute-api.us-east-1.amazonaws.com \
            --out "${GITHUB_WORKSPACE}/smoke-prod.json"

      - name: Record decision
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Who actually clicked Approve, and how long it sat waiting.
          APPROVER=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/approvals" \
            --jq '.[0].user.login' 2>/dev/null || echo unknown)
          LATENCY=$(( $(date -u +%s) - ${{ needs.gamma.outputs.gamma_finished_at }} ))
          MODE=$([ "${{ needs.gamma.outputs.target_env }}" = "production-auto" ] && echo auto || echo manual)

          node scripts/record-deploy.js --phase decision \
            --deploy-id "${{ needs.gamma.outputs.deploy_id }}" \
            --mode "$MODE" \
            --approved-by "$APPROVER" \
            --latency "$LATENCY"
