name: CI

# Pull-request checks. This workflow deliberately holds NO AWS credentials and
# requests no id-token permission: the repo is public, anyone can open a PR from
# a fork, and a fork-triggered job that can assume a deploy role is the single
# worst failure mode available to us. Deploys happen post-merge, in deploy.yml.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '23.11.0'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        working-directory: backend
        run: npm ci && npm run install:lambdas

      - name: Typecheck
        working-directory: backend
        run: npx tsc --noEmit -p tsconfig.json

      - name: Test
        working-directory: backend
        # The repo currently has no runnable Jest tests. jest's testMatch points
        # at **/__tests__/**, which does not exist, and the single .test.ts file
        # (agent-handler/tools/detection-engine.test.ts) is a standalone script
        # with no describe/it blocks that calls process.exit() — jest cannot run
        # it. So this step is a placeholder that must not be read as "tests
        # passed": it currently asserts nothing. Remove the flag as soon as real
        # tests exist, so a green check starts meaning something.
        run: npm test --if-present -- --passWithNoTests

      - name: CDK synth (gamma)
        working-directory: backend
        env:
          LENSY_ENV: gamma
          # PR CI holds no secrets by design, so synth opts out of the
          # PERPLEXITY_API_KEY guard rather than tripping over it.
          LENSY_SYNTH_ONLY: 'true'
          # cdk.context.json caches the perseveranceai.com hosted-zone lookup,
          # but its key embeds the account id. Without credentials CDK_DEFAULT_
          # ACCOUNT is unset, the key misses, and CDK attempts a live lookup it
          # cannot perform. Pinning both makes the cache hit, so synth stays
          # credential-free. Neither value is secret — both are already in
          # deploy.yml and the runbook in this public repo.
          CDK_DEFAULT_ACCOUNT: '951411676525'
          CDK_DEFAULT_REGION: us-east-1
        # Synth needs no AWS credentials and catches the class of error that
        # only shows up at deploy time — bad construct wiring, invalid props.
        run: npx cdk synth --quiet

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '23.11.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Test
        working-directory: frontend
        env:
          CI: true
        run: npm test -- --watchAll=false --passWithNoTests

      - name: Build
        working-directory: frontend
        env:
          # create-react-app promotes lint warnings to build errors whenever CI
          # is set, which Actions does automatically. The app carries a backlog
          # of unused-import warnings, so an honest build would fail on debt
          # that predates this pipeline. Unsetting it keeps the build truthful
          # about compilation while leaving the lint cleanup as its own task —
          # if that cleanup lands, delete this and let warnings fail the build.
          CI: false
        run: npm run build:gamma
