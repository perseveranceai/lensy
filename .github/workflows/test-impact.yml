name: Test impact

# Flags PRs that change product code without changing any tests, as a
# WARNING on the PR — it never fails. Tests are written automatically by the
# pre-push hook's coding agent (scripts/pre-cr.sh), and the real gate is that
# the e2e suite passes (ci.yml on the PR, deploy.yml on gamma). A refactor
# legitimately needs no test change, so a hard failure here would only add
# friction. The warning tells the reviewer to look twice.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-impact:
    name: Test impact (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=$(git diff --name-only "$BASE"..."$HEAD")
          code=$(printf '%s\n' "$changed" \
            | grep -E '^(frontend/src/|frontend/public/index\.html$|backend/lambda/|backend/lib/)' \
            | grep -vE '^frontend/src/tailwind\.css$' || true)
          if [ -z "$code" ]; then echo "No product-code changes."; exit 0; fi
          tests=$(printf '%s\n' "$changed" | grep -E '^(frontend/e2e/|docs/test-cases\.md$)' || true)
          if [ -n "$tests" ]; then
            echo "Product code changed, and tests were updated:"; printf '  %s\n' $tests; exit 0
          fi
          echo "::warning::This PR changes product code but no tests. Fine for a refactor; otherwise the pre-push hook (scripts/pre-cr.sh) was probably skipped — check that frontend/e2e/ covers the change."
          printf '  %s\n' $code
